<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <img src="assets/media/logos/logo.png" alt="Logo" class="login-logo">
      <h1>Turnike Monitor</h1>
      <p>Giriş yapmak için kullanıcı adı ve şifrenizi girin</p>
    </div>

    <div class="login-alert" *ngIf="hasError">
      Kullanıcı adı veya şifre hatalı. Lütfen tekrar deneyin.
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="submit()" class="login-form">
      <div class="form-group">
        <label for="email">Kullanıcı Adı</label>
        <input
          type="text"
          id="email"
          formControlName="email"
          class="form-control"
          placeholder="Kullanıcı adınızı girin"
          [class.is-invalid]="loginForm.controls['email'].invalid && loginForm.controls['email'].touched"
        />
      </div>

      <div class="form-group">
        <label for="password">Şifre</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-control"
          placeholder="Şifrenizi girin"
          [class.is-invalid]="loginForm.controls['password'].invalid && loginForm.controls['password'].touched"
        />
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loginForm.invalid || isLoading">
        {{ isLoading ? 'Giriş yapılıyor...' : 'Giriş Yap' }}
      </button>
    </form>
  </div>
</div>
