<div class="home-container">
  <div class="home-header">
    <div class="header-left">
      <img src="assets/media/logos/logo.png" alt="Logo" class="home-logo">
      <h1>Turnike Monitor</h1>
    </div>
    <button (click)="logout()" class="btn btn-danger">Çıkış Yap</button>
  </div>

  <div class="home-content">
    <div class="selection-card">
      <div class="form-group">
        <label>Turnike Sayısı</label>
        <select class="form-control" [(ngModel)]="selectedGrid">
          <option *ngFor="let item of gridCount" [value]="item.id">{{ item.id }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Cihaz Seçimi <span class="required">*</span></label>
        <select class="form-control" [(ngModel)]="selectedTerminal">
          <option *ngFor="let term of terminals" [ngValue]="term">{{ term.Ad }}</option>
        </select>
      </div>

      <button
        (click)="goToTurnike()"
        class="btn btn-primary btn-block"
        [disabled]="!selectedTerminal"
      >
        TURNİKE EKRANI
      </button>
    </div>
  </div>
</div>
