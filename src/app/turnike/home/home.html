<div class="home-container">
  <div class="home-header">
    <div class="header-left">
      <img src="assets/media/logos/logo.png" alt="Logo" class="home-logo">
      <h1>Turnike Monitor</h1>
    </div>
    <button (click)="logout()" class="btn btn-danger">Çıkış Yap</button>
  </div>

  <div class="home-content">
    <div class="selection-card">
      <div class="form-group">
        <label>Turnike Sayısı</label>
        <select class="form-control" [(ngModel)]="selectedGrid" (ngModelChange)="onGridChange()">
          @for (item of gridCount; track item.id) {
            <option [value]="item.id">{{ item.id }}</option>
          }
        </select>
      </div>

      @for (idx of getGridIndices(); track idx) {
        <div class="form-group">
          <label>Cihaz {{ idx + 1 }} Seçimi <span class="required">*</span></label>
          <select class="form-control" [(ngModel)]="selectedTerminals[idx]">
            @for (term of terminals; track term) {
              <option [ngValue]="term">{{ term.Ad }}</option>
            }
          </select>
        </div>
      }

      <button
        (click)="goToTurnike()"
        class="btn btn-primary btn-block"
        [disabled]="selectedTerminals.includes(null)"
      >
        TURNİKE EKRANI
      </button>
    </div>
  </div>
</div>
